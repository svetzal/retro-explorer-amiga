[project]
name = "retro-explorer-amiga"
version = "0.2.1"
description = "A starter that equips a coding agent to build for, and explore, the Commodore Amiga"
requires-python = ">=3.12"
dependencies = [
    "amitools>=0.9.0",
    "docling[rapidocr]>=2.150.1",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pypdfium2>=5.15.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts"]
python_files = ["*_spec.py"]
python_classes = ["Describe*"]
python_functions = ["should_*"]
pythonpath = ["scripts"]
markers = [
    "integration: real Docling pipeline, or real Amiberry with the owner's firmware; skipped when absent",
]

[tool.ruff]
line-length = 100
# Skills are copied verbatim from their source repository; keep them byte-identical.
extend-exclude = [".agents"]

[tool.ruff.lint]
extend-select = ["C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
source = ["scripts", "examples"]
branch = true
omit = ["*_spec.py", "*/conftest.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-cov>=7.1.0", "ruff>=0.17.5"]
